# dsh-longterm-memory 的 bundle 补丁。
#
# 这个文件让本包成为一个 PROFILE LAYER，而不只是一个普通依赖。当用户执行
#
#   dsh plugin --profile <profile> add dsh-longterm-memory
#
# 时，Loader 会按 dsh.profile.bundles 与已安装包做对账：清单里声明了
# `dsh.bundle.patch` 的依赖会进入 layer 栈，下面这行 insert 才真正把插件挂载起来。
# 缺少它时包能装上但什么都不做（会打印 "declares no dsh.bundle" 警告）。
#
# 覆盖本行的 config 会整体替换（Loader 的 override 语义），改配置时请写全字段。
- insert:
    - id: dsh-longterm-memory
      name: dsh-longterm-memory
      config:
        # 记忆根目录，相对当前会话工作区。'.' 表示直接放在项目根。
        rootDir: .
        # 单次 memory_read 返回的最大字符数，超出截断并提示。
        maxReadChars: 12000
        # memory_search 最多返回多少个命中文件。
        maxSearchFiles: 12
        # 每个命中文件最多展示多少条匹配行。
        maxSearchLines: 3
